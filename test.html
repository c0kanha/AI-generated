<style>
  :root{

  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.5}
  header{padding:20px 16px 8px;text-align:center}
  header h1{margin:0;font-size:22px}
  header p{margin:6px 0 0;color:var(--muted);font-size:14px}
  main{max-width:760px;margin:0 auto;padding:8px 16px 70px}

  .qz{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:12px 0}
  .qzq{font-weight:600;margin-bottom:6px;display:flex;align-items:flex-start;gap:10px}
  .num{background:var(--accent);color:#fff;font-weight:700;font-size:13px;
    border-radius:8px;padding:3px 9px;flex-shrink:0}
  .qztext{flex:1}
  .speak{border:none;background:var(--line);border-radius:8px;cursor:pointer;
    font-size:15px;padding:4px 9px;flex-shrink:0}
  .speak:hover{filter:brightness(.95)}
  .opt{display:block;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    margin:7px 0;cursor:pointer;font-size:15px;background:#fafbfc}
  .opt input{margin-right:9px}
  .opt.correct{border-color:var(--good);background:#f0fdf4}
  .opt.wrong{border-color:var(--bad);background:#fef2f2}

  .bar{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 40%);
    padding:12px 0 4px;margin-top:8px}
  .btn{display:block;width:100%;padding:14px;border:none;border-radius:10px;
    background:var(--accent);color:#fff;font-size:16px;font-weight:700;cursor:pointer}
  .btn.alt{background:var(--card);color:var(--accent);border:1px solid var(--accent);margin-top:8px}
  .score{position:sticky;top:0;z-index:5;text-align:center;font-size:19px;font-weight:700;
    margin:0 0 8px;padding:14px;background:var(--card);border:1px solid var(--line);
    border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.06)}
  .score small{display:block;font-weight:500;color:var(--muted);font-size:13px;margin-top:4px}
</style>
</head>

function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function shuffle(arr){arr=arr.slice();for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}return arr;}

function speak(text){
  if(!('speechSynthesis' in window))return;
  window.speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  u.rate=0.95;u.lang='en-US';
  window.speechSynthesis.speak(u);
}

  slaves:["Africans","People from Africa","Native Americans","Europeans","Indentured servants","Asians"],
  cabinet:["Speaker of the House","Chief Justice of the United States","Governor","Mayor","U.S. Senator","Postmaster General"],
  rival:["Soviet Union","Russia","China","Cuba","Germany","Japan"],
  concern:["Communism","Nuclear war","Terrorism","Fascism","Economic collapse"],
  anthem:["The Star-Spangled Banner","America the Beautiful","God Bless America","My Country, 'Tis of Thee"],
  motto:["Out of many, one","We all become one","In God We Trust","Liberty and Justice for All","Land of the Free"],
  territory:["Louisiana Territory","Louisiana","Florida","Texas","Alaska","Oregon Territory","California"],
  states:["Vermont","Kentucky","Ohio","Maine","Tennessee","Florida","Texas"],
  rights:["The right to a fair trial","The right to vote","The right to privacy","The right to an attorney","The right to own property","Freedom from unfair taxation"]
};
// Questions whose answers are descriptive civics statements (default kind).
const CONCEPT_QS=[1,3,4,5,8,10,13,15,19,26,28,31,32,33,34,35,37,47,49,51,55,56,60,64,66,67,68,69,70,71,72,73,77,84,95,103,112];

const KIND_MAP={};
function setKinds(kind,ns){ns.forEach(n=>{KIND_MAP[n]=kind;});}
Object.keys(POOLED).forEach(k=>setKinds(k,POOLED[k]));
setKinds('people_now',[23,29,30,38,39,57,61]);
setKinds('founderNames',[78,83]);
setKinds('womenLeaders',[99]);
setKinds('presidentNames',[105]);
setKinds('terms',[22,25,36]);
setKinds('counts',[7,21,24,27,53,54]);
setKinds('dates',[79,98,102,104]);
setKinds('amendments',[97]);
setKinds('economy',[12]);
setKinds('actors',[40,42,43,44,45]);
setKinds('branches',[16,17,18,46,50,52]);
setKinds('places',[62,119,120]);
setKinds('innovation',[118]);
setKinds('tribe',[117]);
setKinds('natives',[74]);
setKinds('slaves',[75]);
setKinds('cabinet',[48]);
setKinds('rival',[108]);
setKinds('concern',[109]);
setKinds('anthem',[123]);
setKinds('motto',[124]);
setKinds('territory',[90]);
setKinds('states',[81]);
setKinds('rights',[6,63,65]);

function candidatePool(q){
  const kind=KIND_MAP[q.n]||'concepts';
  let arr;
  if(POOLED[kind]) arr=POOLED[kind].flatMap(n=>byN(n).a);
  else if(BANKS[kind]) arr=BANKS[kind].slice();
  else arr=CONCEPT_QS.flatMap(n=>byN(n).a);
  const own=new Set(q.a.map(norm));
  return [...new Set(arr)].filter(s=>!own.has(norm(s)));
}
function distractorsFor(q){
  let c=shuffle(candidatePool(q)).slice(0,3);
  if(c.length<3){ // top up so every question always has 4 options
    const own=new Set(q.a.map(norm));
    const used=new Set(c.map(norm));
    const extra=shuffle(POOL.map(o=>o.a[0]))
      .filter(s=>!own.has(norm(s)) && !used.has(norm(s)));
    c=c.concat(extra).slice(0,3);
  }
  return c;
}

let items=[], picks=[], submitted=false;

function build(){
  const chosen=shuffle(POOL).slice(0,TEST_SIZE);
  items=chosen.map(item=>{
    const correct=item.a[0];
    return {item, correct, opts:shuffle([correct,...distractorsFor(item)])};
  });
  picks=items.map(()=>null);
  submitted=false;
}
function pickOpt(i,val){ if(!submitted) picks[i]=val; }
function submit(){ submitted=true; render(); window.scrollTo(0,0); }
function again(){ build(); render(); window.scrollTo(0,0); }

function render(){
  let h='';
  if(submitted){
    const score=items.reduce((s,it,i)=>s+(picks[i]===it.correct?1:0),0);
    const pct=Math.round(score/items.length*100);
    const pass=pct>=60;
    h+=`<div class="score" style="color:${pass?'var(--good)':'var(--bad)'}">
      ${score} / ${items.length} &nbsp;(${pct}%) ${pass?'✓ Pass':'✗ Keep studying'}
      <small>USCIS passing score is 60% (12 of 20). Correct answers shown in green.</small>
    </div>`;
  }
  items.forEach((it,i)=>{
    h+=`<div class="qz">
      <div class="qzq">
        <span class="num">${it.item.n}</span>
        <span class="qztext">${i+1}. ${escapeHtml(it.item.q)}</span>
        <button class="speak" title="Read aloud" onclick='speak(${JSON.stringify(it.item.q)})'>🔊</button>
      </div>`;
    it.opts.forEach(o=>{
      let cls='opt';
      if(submitted){
        if(o===it.correct)cls+=' correct';
        else if(picks[i]===o)cls+=' wrong';
      }
      const checked=picks[i]===o?'checked':'';
      const dis=submitted?'disabled':'';
      h+=`<label class="${cls}">
        <input type="radio" name="q${i}" ${checked} ${dis} onchange='pickOpt(${i},${JSON.stringify(o)})'>
        ${escapeHtml(o)}
      </label>`;
    });
    h+=`</div>`;
  });
  h+=`<div class="bar">`;
  h+= submitted
    ? `<button class="btn" onclick="again()">New 20 Questions</button>`
    : `<button class="btn" onclick="submit()">Submit Test</button>
       <button class="btn alt" onclick="again()">Shuffle New 20</button>`;
  h+=`</div>`;
  document.getElementById('app').innerHTML=h;
}

build();
render();
</script>
