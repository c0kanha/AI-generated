// ===== STATE =====
let mode = 'browse';
let flashIndex = 0;
let flashOrder = [];
let flashRevealed = false;
let quizState = null; // { questions: [], answers: [], grades: [], submitted: false }

// ===== HELPERS =====
function getFiltered() {
  const term = document.getElementById('search').value.trim().toLowerCase();
  const only65 = document.getElementById('only65').checked;
  return QUESTIONS.filter(q => {
    if (only65 && !q.star) return false;
    if (!term) return true;
    if (q.q.toLowerCase().includes(term)) return true;
    if (q.a.some(a => a.toLowerCase().includes(term))) return true;
    return false;
  });
}

function setMode(m) {
  mode = m;
  ['browse','flash','quiz'].forEach(x => {
    document.getElementById('mode-'+x).classList.toggle('active', x===m);
  });
  if (m === 'flash') {
    flashOrder = shuffle(getFiltered().map(q => q.n));
    flashIndex = 0;
    flashRevealed = false;
  }
  if (m === 'quiz') {
    quizState = null;
  }
  render();
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  document.documentElement.setAttribute('data-theme', cur === 'dark' ? 'light' : 'dark');
  localStorage.setItem('theme', document.documentElement.getAttribute('data-theme'));
}

// ===== RENDERERS =====
function render() {
  if (mode === 'browse') renderBrowse();
  else if (mode === 'flash') renderFlash();
  else if (mode === 'quiz') renderQuiz();
}

function renderBrowse() {
  const app = document.getElementById('app');
  const filtered = getFiltered();
  const hideAns = document.getElementById('hideAns').checked;
  const visibleNums = new Set(filtered.map(q => q.n));

  let html = `<div class="info-bar">
    Showing <strong>${filtered.length}</strong> of 128 questions.
    Click a question to toggle its answers. Star (<span style="color:var(--star)">★</span>) marks 65/20 questions.
  </div>`;

  if (filtered.length === 0) {
    html += `<div class="empty">No questions match your filters.</div>`;
  } else {
    for (const sec of SECTIONS) {
      const secQuestions = QUESTIONS.filter(q =>
        sec.sub.some(s => q.n >= s.range[0] && q.n <= s.range[1]) && visibleNums.has(q.n));
      if (secQuestions.length === 0) continue;
      html += `<div class="section-title">${sec.title}</div>`;
      for (const sub of sec.sub) {
        const subQuestions = QUESTIONS.filter(q =>
          q.n >= sub.range[0] && q.n <= sub.range[1] && visibleNums.has(q.n));
        if (subQuestions.length === 0) continue;
        html += `<div class="subsection-title">${sub.title}</div>`;
        for (const q of subQuestions) {
          html += renderQCard(q, hideAns);
        }
      }
    }
  }
  app.innerHTML = html;
}

function renderQCard(q, hideAns) {
  const ansClass = hideAns ? 'answers collapsed' : 'answers';
  const star = q.star ? '<span class="qstar" title="65/20 question">★</span>' : '';
  const varies = q.varies ? '<div class="note">(Answer changes — verify on uscis.gov/citizenship/testupdates)</div>' : '';
  return `<div class="qcard" data-n="${q.n}">
    <div class="qhead" onclick="toggleAnswer(${q.n})">
      <div class="qnum">${q.n}.</div>
      <div class="qtext">${escapeHtml(q.q)}</div>
      ${star}
    </div>
    <div class="${ansClass}" id="ans-${q.n}">
      <ul>${q.a.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
      ${varies}
    </div>
  </div>`;
}

function toggleAnswer(n) {
  const el = document.getElementById('ans-'+n);
  if (el) el.classList.toggle('collapsed');
}

function renderFlash() {
  const app = document.getElementById('app');
  const filtered = getFiltered();
  // Re-sync flashOrder if filter changed
  const filteredNums = new Set(filtered.map(q => q.n));
  flashOrder = flashOrder.filter(n => filteredNums.has(n));
  for (const q of filtered) if (!flashOrder.includes(q.n)) flashOrder.push(q.n);

  if (flashOrder.length === 0) {
    app.innerHTML = `<div class="empty">No questions match your filters.</div>`;
    return;
  }
  if (flashIndex >= flashOrder.length) flashIndex = 0;
  const q = QUESTIONS.find(x => x.n === flashOrder[flashIndex]);

  const star = q.star ? ' ★' : '';
  app.innerHTML = `
    <div class="flash-stage">
      <div class="flashcard" onclick="flashFlip()">
        <div class="flash-tag">Question ${q.n}${star}</div>
        <div class="flash-q">${escapeHtml(q.q)}</div>
        ${flashRevealed ? `<div class="flash-a"><ul>${q.a.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>${q.varies ? '<div class="note">(Verify on uscis.gov/citizenship/testupdates)</div>' : ''}</div>` : `<div class="flash-tag" style="margin-top:20px">(click card to reveal answer)</div>`}
      </div>
      <div class="flash-controls">
        <button onclick="flashPrev()">← Prev</button>
        <button class="primary" onclick="flashFlip()">${flashRevealed ? 'Hide' : 'Reveal'} Answer</button>
        <button onclick="flashNext()">Next →</button>
        <button onclick="flashShuffle()">Shuffle</button>
      </div>
      <div class="flash-progress">${flashIndex + 1} / ${flashOrder.length}</div>
    </div>`;
}

function flashFlip() { flashRevealed = !flashRevealed; renderFlash(); }
function flashPrev() { flashIndex = (flashIndex - 1 + flashOrder.length) % flashOrder.length; flashRevealed = false; renderFlash(); }
function flashNext() { flashIndex = (flashIndex + 1) % flashOrder.length; flashRevealed = false; renderFlash(); }
function flashShuffle() { flashOrder = shuffle(flashOrder); flashIndex = 0; flashRevealed = false; renderFlash(); }

function renderQuiz() {
  const app = document.getElementById('app');
  if (!quizState) {
    const only65 = document.getElementById('only65').checked;
    const totalQ = only65 ? 10 : 20;
    const passQ = only65 ? 6 : 12;
    app.innerHTML = `
      <div class="quiz-intro">
        <h2>${only65 ? '65/20 Practice Test' : 'Practice Civics Test'}</h2>
        <p>You'll get <strong>${totalQ} random questions</strong>. Need <strong>${passQ}</strong> correct to pass.</p>
        <p style="color:var(--muted); font-size:13px">
          Type your answer, then grade yourself against the official answer (the real test is oral and the officer judges).
        </p>
        <button onclick="startQuiz()">Start Quiz</button>
      </div>`;
    return;
  }

  let html = '';
  quizState.questions.forEach((q, i) => {
    const grade = quizState.grades[i]; // null, true, false
    const cls = grade === true ? 'quiz-q correct' : grade === false ? 'quiz-q incorrect' : 'quiz-q';
    const star = q.star ? ' ★' : '';
    html += `<div class="${cls}">
      <h3>${i+1}. ${escapeHtml(q.q)} <span style="color:var(--muted);font-weight:normal;font-size:13px">(#${q.n}${star})</span></h3>
      <textarea id="qa-${i}" placeholder="Type your answer..." oninput="updateQuizAnswer(${i}, this.value)">${escapeHtml(quizState.answers[i] || '')}</textarea>
      <div class="reveal">
        <strong>Official answer${q.a.length > 1 ? 's (any one)' : ''}:</strong>
        <ul>${q.a.map(a => `<li>${escapeHtml(a)}</li>`).join('')}</ul>
        ${q.varies ? '<div class="note">(Verify on uscis.gov/citizenship/testupdates)</div>' : ''}
      </div>
      <div class="self-grade">
        <button class="${grade===true?'correct-btn':''}" onclick="gradeQuiz(${i}, true)">✓ I got it right</button>
        <button class="${grade===false?'wrong-btn':''}" onclick="gradeQuiz(${i}, false)">✗ I got it wrong</button>
      </div>
    </div>`;
  });

  const graded = quizState.grades.filter(g => g !== null).length;
  const total = quizState.questions.length;
  const correct = quizState.grades.filter(g => g === true).length;
  const passQ = total === 10 ? 6 : 12;
  const allGraded = graded === total;
  const passed = correct >= passQ;

  if (allGraded) {
    html += `<div class="quiz-result">
      <h2>Result</h2>
      <div class="quiz-score-big ${passed ? 'quiz-pass' : 'quiz-fail'}">${correct} / ${total}</div>
      <p class="${passed ? 'quiz-pass' : 'quiz-fail'}" style="font-size:20px;font-weight:600">
        ${passed ? '✓ Passed (need ' + passQ + ')' : '✗ Did not pass (need ' + passQ + ')'}
      </p>
      <button onclick="quizState=null;render()">New Quiz</button>
    </div>`;
  } else {
    html += `<div class="quiz-result">
      <p>Graded: ${graded} / ${total} · Correct so far: ${correct}</p>
      <button onclick="if(confirm('Reset quiz?')){quizState=null;render()}">Cancel Quiz</button>
    </div>`;
  }

  app.innerHTML = html;
}

function startQuiz() {
  const only65 = document.getElementById('only65').checked;
  const pool = only65 ? QUESTIONS.filter(q => q.star) : QUESTIONS;
  const totalQ = only65 ? 10 : 20;
  const picked = shuffle(pool.slice()).slice(0, totalQ);
  quizState = {
    questions: picked,
    answers: new Array(totalQ).fill(''),
    grades: new Array(totalQ).fill(null),
  };
  render();
}

function updateQuizAnswer(i, val) {
  if (quizState) quizState.answers[i] = val;
}

function gradeQuiz(i, correct) {
  if (!quizState) return;
  quizState.grades[i] = correct;
  render();
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== INIT =====
const savedTheme = localStorage.getItem('theme');
if (savedTheme) document.documentElement.setAttribute('data-theme', savedTheme);
render();
</script>
